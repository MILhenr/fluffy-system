<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Prancha tática → 3D</title>
<style>
  html,body{margin:0;padding:0;background:#0a0a0a;color:#eee;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;height:100%;overflow:hidden;}
  #app{display:flex;flex-direction:column;height:100vh;width:100vw;}
  #toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:9px 14px;background:#151515;border-bottom:1px solid #262626;}
  .iconbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:#232323;border:1px solid #3a3a3a;color:#eee;width:68px;height:60px;border-radius:16px;cursor:pointer;font-size:11.5px;line-height:1;flex-shrink:0;box-shadow:0 2px 5px rgba(0,0,0,.25);transition:transform .08s;}
  .iconbtn:active{transform:scale(0.93);}
  .iconbtn .ic{font-size:24px;line-height:1;}
  .iconbtn:hover{background:#2a2a2a;}
  .iconbtn:disabled{opacity:.3;cursor:default;}
  .iconbtn.primary{background:#2c4270;border-color:#3d5a95;}
  .iconbtn.warn{background:#4a2a2a;border-color:#6a3a3a;}
  #toolbar button.txt{background:#202020;border:1px solid #333;color:#eee;padding:11px 16px;border-radius:12px;font-size:14.5px;cursor:pointer;white-space:nowrap;}
  #toolbar button.txt:hover{background:#2a2a2a;}
  #toolbar button.txt.primary{background:#2c4270;border-color:#3d5a95;}
  #toolbar .sep{width:1px;height:44px;background:#2c2c2c;margin:0 4px;}
  #stepbar{display:flex;align-items:center;gap:10px;padding:8px 14px;background:#101010;border-bottom:1px solid #262626;}
  #stepbar button.txt{border:1px solid #3a3a3a;color:#eee;padding:11px 16px;border-radius:14px;font-size:15px;cursor:pointer;font-weight:600;box-shadow:0 2px 5px rgba(0,0,0,.25);}
  #stepAdd{background:#274a30;border-color:#3a7048;}
  #stepDel{background:#4a2a2a;border-color:#6a3a3a;}
  #stepLabel{font-size:13px;color:#ddd;min-width:64px;text-align:center;font-weight:600;}
  #stepSlider{flex:1;accent-color:#e0b84a;}
  #stage{flex:1;position:relative;overflow:hidden;background:#0a0a0a;display:flex;align-items:center;justify-content:center;}
  #courtCanvas{touch-action:none;cursor:default;}
  #bottombar{display:flex;gap:8px;align-items:center;padding:5px 12px;background:#151515;border-top:1px solid #262626;flex-wrap:wrap;}
  #bottombar button.txt{background:#202020;border:1px solid #333;color:#eee;padding:10px 14px;border-radius:12px;font-size:14px;cursor:pointer;}
  #bottombar button.txt:hover{background:#2a2a2a;}
  #bottombar button.txt.primary{background:#2c4270;border-color:#3d5a95;}
  #scrub{flex:1;min-width:80px;accent-color:#8899cc;}
  .hint{font-size:10.5px;color:#777;padding:0 14px 5px;background:#151515;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .editPop{position:absolute;background:#1e1e1e;border:1px solid #444;border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px;z-index:20;box-shadow:0 4px 18px rgba(0,0,0,.5);}
  .modalOverlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;box-sizing:border-box;}
  .modalCard{background:#1c1c1c;border:1px solid #3a3a3a;border-radius:14px;padding:18px;max-width:360px;width:100%;max-height:75vh;overflow-y:auto;}
  .modalCard h3{margin:0 0 12px;font-size:15px;color:#eee;}
  .modalCard input[type=text]{width:100%;background:#111;border:1px solid #3a3a3a;color:#eee;padding:10px;border-radius:8px;font-size:14px;box-sizing:border-box;margin-bottom:12px;}
  .modalBtnRow{display:flex;gap:8px;justify-content:flex-end;margin-top:6px;}
  .modalBtnRow button{background:#2c4270;border:1px solid #3d5a95;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;cursor:pointer;}
  .modalBtnRow button.secondary{background:#2a2a2a;border-color:#444;}
  .movementItem{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #2a2a2a;gap:8px;}
  .movementItem .mname{font-size:13.5px;color:#eee;}
  .movementItem .mdate{color:#777;font-size:11px;display:block;}
  .movementItem button{background:#2c4270;border:1px solid #3d5a95;color:#fff;padding:8px 12px;border-radius:8px;font-size:12.5px;cursor:pointer;flex-shrink:0;}
  .movementItem button.del{background:#4a2a2a;border-color:#6a3a3a;}
  .ctrlBtn{width:56px;height:56px;border-radius:14px;background:rgba(30,30,30,0.75);border:1px solid rgba(255,255,255,0.25);color:#fff;font-size:22px;-webkit-user-select:none;user-select:none;touch-action:none;}
  .ctrlBtn:active{background:rgba(60,60,60,0.9);}
  .editPop input{background:#111;border:1px solid #3a3a3a;color:#eee;padding:5px 7px;border-radius:5px;font-size:13px;width:120px;}
  .editPop .row{display:flex;gap:6px;}
  .editPop button{background:#3a5a8a;border:none;color:#fff;padding:5px 10px;border-radius:5px;font-size:12px;cursor:pointer;}
  #status{font-size:12px;color:#8a8;margin-left:auto;padding-right:4px;min-width:80px;text-align:right;}
  select{background:#202020;border:1px solid #333;color:#eee;padding:9px 12px;border-radius:12px;font-size:14px;}

  #viewer3D{display:none;flex-direction:column;height:100%;width:100%;}
  #v3dCanvasWrap{flex:1;position:relative;}
  .hud{position:absolute;left:0;right:0;top:0;padding:12px 16px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;}
  .badge{background:rgba(20,20,20,0.65);border:1px solid #444;border-radius:6px;padding:6px 12px;font-size:12px;letter-spacing:.03em;color:#aaa;}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* =========================================================================
   PARTE 1 — EDITOR 2D EM ETAPAS
   entities: identidade fixa dos jogadores/bola
   steps: sequência de "capturas" — cada etapa guarda a posição (fração 0..1)
   e o ângulo de olhar de cada entidade naquele momento da jogada
   ========================================================================= */
const COURT_LEN = 42, COURT_WID = 23; // pouco acima do oficial
const MIN_SPEED = 1.6, MAX_SPEED = 9.2, MIN_STEP_DURATION = 0.07;
const BALL_SPEED = 12.5; // m/s constante — a bola sempre viaja nessa velocidade,
                         // nunca fica mais lenta só porque um jogador correu
                         // muito no mesmo intervalo.

let entities = [];               // {id, team:'blue'|'red'|'ball', number, name}
let steps = [ {positions:{}} ];  // {positions:{ [id]: {x,y,facingAngle} }}
let currentStep = 0;
let selectedId = null;
let idCounter = 1;
let nextBlueNum = 1, nextRedNum = 1;

const canvas = document.getElementById('courtCanvas');
const ctx = canvas.getContext('2d');
const stage = document.getElementById('stage');
let court = {x:0,y:0,w:0,h:0};

function layoutCanvas(){
  const availW = stage.clientWidth - 4;
  const availH = stage.clientHeight - 4;
  const aspect = COURT_WID/COURT_LEN;
  let h = availH, w = h*aspect;
  if(w>availW){ w = availW; h = w/aspect; }
  canvas.width = w; canvas.height = h;
  canvas.style.width = w+'px'; canvas.style.height = h+'px';
  const pad = h*0.014;
  court = {x: w*0.015, y: pad*1.1, w: w*0.97, h: h - pad*2.2};
  draw();
}
function toPx(fx, fy){ return { x: court.x + fx*court.w, y: court.y + fy*court.h }; }
function toFrac(px, py){ return { x: (px-court.x)/court.w, y: (py-court.y)/court.h }; }

function drawCourt(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const grad = ctx.createLinearGradient(0,court.y,0,court.y+court.h);
  grad.addColorStop(0,'#5b8fc4'); grad.addColorStop(1,'#4a7ab0');
  ctx.fillStyle = grad;
  roundRect(court.x, court.y, court.w, court.h, 14); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.9)';
  ctx.lineWidth = Math.max(1.5, court.w*0.006);
  ctx.strokeRect(court.x, court.y, court.w, court.h);
  ctx.beginPath(); ctx.moveTo(court.x, court.y+court.h/2); ctx.lineTo(court.x+court.w, court.y+court.h/2); ctx.stroke();
  ctx.beginPath(); ctx.arc(court.x+court.w/2, court.y+court.h/2, court.w*0.16, 0, Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.arc(court.x+court.w/2, court.y+court.h/2, court.w*0.012, 0, Math.PI*2); ctx.fillStyle='rgba(255,255,255,0.9)'; ctx.fill();
  [0,1].forEach(side=>{
    const yEdge = side===0 ? court.y : court.y+court.h;
    ctx.beginPath();
    ctx.arc(court.x+court.w/2, yEdge, court.w*0.34, side===0? 0: Math.PI, side===0? Math.PI: Math.PI*2);
    ctx.stroke();
    const gw = court.w*0.18, gh = court.h*0.028;
    ctx.strokeRect(court.x+court.w/2-gw/2, yEdge-(side===0?gh:0), gw, gh);
  });
  [0.20,0.80].forEach(fy=>{
    const p = toPx(0.5, fy);
    ctx.beginPath(); ctx.arc(p.x,p.y, court.w*0.01,0,Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,0.85)'; ctx.fill();
  });
}
function roundRect(x,y,w,h,r){
  ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}

function lerpAngle(a,b,u){
  let diff = ((b-a+Math.PI)%(Math.PI*2))-Math.PI;
  if(diff<-Math.PI) diff+=Math.PI*2;
  return a+diff*u;
}

// posição/ângulo de uma entidade num instante t (segundos) ao longo de TODAS as etapas
function entityStepDist(i, id){
  const a = steps[i].positions[id], b = steps[i+1].positions[id];
  if(!a||!b) return 0;
  const dx=(b.x-a.x)*COURT_WID, dy=(b.y-a.y)*COURT_LEN;
  return Math.hypot(dx,dy);
}
const PACE_MULTIPLIER = 0.55; // deixa TUDO mais rápido/dinâmico, independente do que estava dominando o tempo da etapa

function segmentDuration(i){
  const ballEnt = entities.find(e=>e.team==='ball');
  let maxLen = 0;
  entities.forEach(e=>{
    if(ballEnt && e.id===ballEnt.id) return; // a bola não dita o ritmo do segmento
    maxLen = Math.max(maxLen, entityStepDist(i, e.id));
  });
  let dur = maxLen<0.06 ? MIN_STEP_DURATION : Math.max(maxLen/MAX_SPEED, MIN_STEP_DURATION);
  if(ballEnt){
    const ballLen = entityStepDist(i, ballEnt.id);
    if(ballLen>0.02) dur = Math.max(dur, ballLen/BALL_SPEED);
  }
  return Math.max(dur * PACE_MULTIPLIER, 0.04);
}
function allDurations(){ const d=[]; for(let i=0;i<steps.length-1;i++) d.push(segmentDuration(i)); return d; }
function totalDuration(durs){ durs = durs || allDurations(); return durs.reduce((a,b)=>a+b,0) || 0.01; }

function sampleEntityAt(id, t, durs, isBall){
  if(steps.length===1 || !steps[0].positions[id]) return steps[currentStep].positions[id] || null;
  if(!durs) durs = allDurations();
  let acc = 0;
  for(let i=0;i<steps.length-1;i++){
    const dur = durs[i];
    const a = steps[i].positions[id], b = steps[i+1].positions[id];
    if(t <= acc+dur || i===steps.length-2){
      if(!a && !b) { acc+=dur; continue; }
      if(!a) return b;
      if(!b) return a;
      let u;
      if(isBall){
        // a bola percorre sua distância na velocidade constante dela; se o
        // segmento for mais longo (porque um jogador demorou mais), ela chega
        // no destino antes e só espera lá — nunca "arrasta" mais devagar.
        const L = entityStepDist(i, id);
        const travel = L>0.02 ? (L/BALL_SPEED)*PACE_MULTIPLIER : 0;
        u = travel>0 ? Math.max(0,Math.min(1,(t-acc)/travel)) : 1;
      } else {
        u = dur>0 ? Math.max(0,Math.min(1,(t-acc)/dur)) : 1;
      }
      // interpolação linear — sem suavizar/desacelerar em cada etapa, pra não
      // criar aquele instante de "pausa" ao chegar em cada uma (futsal é contínuo).
      const ue = u;
      let height = 0;
      if(isBall && b.highPass){
        // passe alto: sobe em arco de parábola; quanto maior a distância
        // percorrida, mais alto o voo (realista)
        const distM = entityStepDist(i, id);
        const peak = Math.min(distM*0.32, 9);
        height = peak * 4*ue*(1-ue);
      }
      return { x:a.x+(b.x-a.x)*ue, y:a.y+(b.y-a.y)*ue, facingAngle: lerpAngle(a.facingAngle||0, b.facingAngle||0, ue), height };
    }
    acc += dur;
  }
  return steps[steps.length-1].positions[id];
}

const TRAIL_PALETTE = ['#5b8cff','#ff6b6b','#4ade80','#facc15','#c084fc','#38bdf8','#fb923c','#f472b6','#a3e635','#2dd4bf'];
function entityTrailColor(e){
  if(e.team==='ball') return '#e8d840';
  const idx = entities.filter(x=>x.team!=='ball').findIndex(x=>x.id===e.id);
  return TRAIL_PALETTE[idx % TRAIL_PALETTE.length];
}

function drawEntityAt(e, pos, isPlaying){
  if(!pos) return;
  const p = toPx(pos.x, pos.y);
  const R = court.w*0.075;

  if(!isPlaying){
    // trajeto: linha ligando as posições da entidade em cada etapa, cor própria
    ctx.save();
    ctx.setLineDash(e.team==='ball' ? [court.w*0.006, court.w*0.012] : [court.w*0.01, court.w*0.009]);
    ctx.strokeStyle = entityTrailColor(e);
    ctx.globalAlpha = e.team==='ball' ? 0.8 : 0.65;
    ctx.lineWidth = Math.max(1.5, court.w*(e.team==='ball'?0.0045:0.005));
    ctx.beginPath();
    let started = false;
    steps.forEach(st=>{
      const sp = st.positions[e.id];
      if(!sp) return;
      const pp = toPx(sp.x, sp.y);
      if(!started){ ctx.moveTo(pp.x,pp.y); started=true; } else ctx.lineTo(pp.x,pp.y);
    });
    ctx.stroke(); ctx.restore();
    // pontinhos em cada etapa — no jogador selecionado, mostra o número da etapa
    steps.forEach((st,i)=>{
      const sp = st.positions[e.id];
      if(!sp) return;
      const pp = toPx(sp.x, sp.y);
      ctx.beginPath(); ctx.arc(pp.x,pp.y, i===currentStep? R*0.13 : R*0.08, 0, Math.PI*2);
      ctx.fillStyle = i===currentStep ? '#fff59d' : entityTrailColor(e);
      ctx.globalAlpha = i===currentStep ? 1 : 0.7;
      ctx.fill(); ctx.globalAlpha = 1;
      if(e.id===selectedId){
        ctx.font = `700 ${Math.max(9,Math.round(R*0.3))}px -apple-system, sans-serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillStyle = '#0a0a0a';
        ctx.beginPath(); ctx.arc(pp.x, pp.y-R*0.42, R*0.22, 0, Math.PI*2);
        ctx.fillStyle = i===currentStep ? '#fff59d' : '#e8e8e8';
        ctx.fill();
        ctx.fillStyle = '#0a0a0a';
        ctx.fillText(String(i+1), pp.x, pp.y-R*0.42+1);
      }
    });
  }

  if(e.team==='ball'){
    ctx.beginPath(); ctx.arc(p.x,p.y,R*0.55,0,Math.PI*2);
    ctx.fillStyle = '#e8d840'; ctx.fill(); ctx.strokeStyle='#333'; ctx.lineWidth=1.5; ctx.stroke();
    return;
  }

  if(!isPlaying){
    const facingAngle = pos.facingAngle ?? -Math.PI/2;
    const handleDist = R*2.0;
    const hx = p.x + Math.cos(facingAngle)*handleDist;
    const hy = p.y + Math.sin(facingAngle)*handleDist;
    ctx.save();
    ctx.strokeStyle = e.id===selectedId ? 'rgba(255,255,255,0.9)' : 'rgba(255,255,255,0.4)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(p.x+Math.cos(facingAngle)*R*0.9, p.y+Math.sin(facingAngle)*R*0.9);
    ctx.lineTo(hx,hy);
    ctx.stroke();
    if(e.id===selectedId){
      ctx.beginPath(); ctx.arc(hx,hy,R*0.6,0,Math.PI*2);
      ctx.fillStyle = '#ffffff'; ctx.fill();
      ctx.strokeStyle = '#333'; ctx.lineWidth = 2; ctx.stroke();
      ctx.save(); ctx.translate(hx,hy); ctx.rotate(facingAngle);
      ctx.fillStyle = '#333';
      ctx.beginPath(); ctx.moveTo(R*0.28,0); ctx.lineTo(-R*0.16,R*0.18); ctx.lineTo(-R*0.16,-R*0.18); ctx.closePath(); ctx.fill();
      ctx.restore();
    } else {
      ctx.beginPath(); ctx.arc(hx,hy,R*0.16,0,Math.PI*2);
      ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.fill();
    }
  }

  const isPov = e.id===selectedId;
  const teamRing = e.team==='blue' ? '#3a5fd0' : '#c0392b';
  const fillColor = isPov ? '#f4c430' : teamRing;
  ctx.beginPath(); ctx.arc(p.x,p.y,R,0,Math.PI*2); ctx.fillStyle = fillColor; ctx.fill();
  ctx.lineWidth = isPov ? 4.5 : 2.5;
  ctx.strokeStyle = isPov ? teamRing : 'rgba(255,255,255,0.85)';
  ctx.stroke();
  ctx.fillStyle = isPov ? '#1a1a1a' : '#fff';
  ctx.font = `700 ${Math.round(R*0.85)}px -apple-system, sans-serif`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(String(e.number), p.x, p.y+1);
  if(e.name){
    ctx.font = `500 ${Math.round(R*0.42)}px -apple-system, sans-serif`;
    ctx.fillStyle = '#f2f2f2';
    ctx.fillText(e.name, p.x, p.y+R+R*0.42);
  }
}

function draw(){
  drawCourt();
  entities.forEach(e=>{
    const pos = steps[currentStep].positions[e.id];
    drawEntityAt(e, pos, false);
  });
  updateHighPassBtnVisibility();
}
function updateHighPassBtnVisibility(){
  const btn = document.getElementById('highPassBtn');
  if(!btn) return;
  const ball = entities.find(e=>e.team==='ball');
  if(ball && selectedId===ball.id && currentStep>0 && steps[currentStep].positions[ball.id]){
    btn.style.display = '';
    const pos = steps[currentStep].positions[ball.id];
    btn.classList.toggle('primary', !!pos.highPass);
  } else {
    btn.style.display = 'none';
  }
}

// INTERAÇÃO: arrastar reposiciona na etapa atual; alça branca define o olhar
// ---------------------------------------------------------------------------
let dragging = null;
let rotatingFacing = null;
let lastTapInfo = {id:null, time:0};

function hitTest(px,py){
  const R = court.w*0.075;
  for(let i=entities.length-1;i>=0;i--){
    const e = entities[i];
    const pos = steps[currentStep].positions[e.id];
    if(!pos) continue;
    const p = toPx(pos.x, pos.y);
    if(Math.hypot(px-p.x,py-p.y) <= R*1.15) return e;
  }
  return null;
}
function facingHandlePx(e){
  const pos = steps[currentStep].positions[e.id];
  const p = toPx(pos.x, pos.y);
  const R = court.w*0.075;
  const angle = pos.facingAngle ?? -Math.PI/2;
  const dist = R*2.0;
  return { x: p.x+Math.cos(angle)*dist, y: p.y+Math.sin(angle)*dist, R };
}
function pointerPos(ev){ const rect = canvas.getBoundingClientRect(); return { x: ev.clientX-rect.left, y: ev.clientY-rect.top }; }

canvas.addEventListener('pointerdown', (ev)=>{
  if(playing2D) return;
  const p = pointerPos(ev);

  // toque em cima de uma peça (jogador ou bola) sempre tem prioridade
  const hit = hitTest(p.x,p.y);
  if(hit){
    selectedId = hit.id; dragging = hit;
    canvas.setPointerCapture(ev.pointerId);
    const now = performance.now();
    if(lastTapInfo.id===hit.id && now-lastTapInfo.time < 350){ openEditPopup(hit); dragging = null; }
    lastTapInfo = {id:hit.id, time:now};
    draw();
    return;
  }

  // só testa a alça de direção se o toque não caiu em cima de nenhuma peça
  if(selectedId!=null){
    const sel = entities.find(e=>e.id===selectedId);
    if(sel && sel.team!=='ball' && steps[currentStep].positions[sel.id]){
      const h = facingHandlePx(sel);
      if(Math.hypot(p.x-h.x, p.y-h.y) <= h.R*1.1){
        rotatingFacing = sel;
        canvas.setPointerCapture(ev.pointerId);
        return;
      }
    }
  }

  selectedId = null;
  draw();
});
canvas.addEventListener('pointermove', (ev)=>{
  if(playing2D) return;
  const p = pointerPos(ev);
  if(rotatingFacing){
    const pos = steps[currentStep].positions[rotatingFacing.id];
    const c = toPx(pos.x, pos.y);
    pos.facingAngle = Math.atan2(p.y-c.y, p.x-c.x);
    pos.customFacing = true;
    draw();
    return;
  }
  if(!dragging) return;
  const f = toFrac(p.x,p.y);
  f.x = Math.min(1.03, Math.max(-0.03, f.x)); f.y = Math.min(1.03, Math.max(-0.03, f.y));
  const pos = steps[currentStep].positions[dragging.id];
  pos.x = f.x; pos.y = f.y;
  recomputeAutoFacing(currentStep);
  draw();
});
function endDrag(){ rotatingFacing = null; dragging = null; draw(); }
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

function openEditPopup(entity){
  document.querySelectorAll('.editPop').forEach(e=>e.remove());
  if(entity.team==='ball') return;
  const rect = canvas.getBoundingClientRect();
  const pos = steps[currentStep].positions[entity.id];
  const p = toPx(pos.x, pos.y);
  const pop = document.createElement('div');
  pop.className='editPop';
  pop.style.left = (rect.left + p.x + 20)+'px';
  pop.style.top = (rect.top + p.y - 10)+'px';

    <div class="row"><input id="popName" type="text" placeholder="Nome" value="${entity.name||''}"></div>
    <div class="row"><button id="popOk">OK</button></div>`;
  document.body.appendChild(pop);
  document.getElementById('popOk').onclick = ()=>{
    entity.number = document.getElementById('popNum').value || entity.number;

}

function recomputeAutoFacing(stepIndex){
  const st = steps[stepIndex];
  if(!st) return;
  const ballEnt = entities.find(e=>e.team==='ball');
  const ballPos = ballEnt ? st.positions[ballEnt.id] : null;
  if(!ballPos) return; // sem bola em quadra, mantém a direção que já estava
  entities.forEach(e=>{
    if(e.team==='ball') return;
    const pos = st.positions[e.id];
    if(!pos || pos.customFacing) return; // direção manual: não mexe
    pos.facingAngle = Math.atan2(ballPos.y-pos.y, ballPos.x-pos.x);
  });
}
function recomputeAllStepsAutoFacing(){
  steps.forEach((st,i)=>recomputeAutoFacing(i));
}
function addEntityToAllSteps(id, pos){
  steps.forEach(st=>{ if(!st.positions[id]) st.positions[id] = {x:pos.x, y:pos.y, facingAngle:pos.facingAngle, customFacing:false}; });
}
function randomHeightM(){ return 1.70 + Math.random()*0.10; } // 1.70 a 1.80m

function populateBaseSquad(){
  const blueXs = [0.2,0.4,0.6,0.8];
  const redXs = [0.2,0.4,0.6,0.8];
  blueXs.forEach(x=>{
    const id = idCounter++;
    entities.push({id, team:'blue', number:nextBlueNum++, name:'', heightM:randomHeightM()});
    addEntityToAllSteps(id, {x, y:0.22, facingAngle:-Math.PI/2});
  });
  redXs.forEach(x=>{
    const id = idCounter++;
    entities.push({id, team:'red', number:nextRedNum++, name:'', heightM:randomHeightM()});
    addEntityToAllSteps(id, {x, y:0.78, facingAngle:Math.PI/2});
  });
  recomputeAllStepsAutoFacing();
}

function updateStepUI(){
  document.getElementById('stepLabel').textContent = `Etapa ${currentStep+1}/${steps.length}`;

  });

// ---------------------------------------------------------------------------
// SALVAR / CARREGAR
// ---------------------------------------------------------------------------
// ---------------------------------------------------------------------------
// Camada de armazenamento: usa window.storage (do Claude) quando disponível;
// se não (por exemplo rodando sozinho no Railway/servidor próprio), usa o
// localStorage do próprio navegador — assim salvar funciona nos dois lugares.
// ---------------------------------------------------------------------------
const hasClaudeStorage = (typeof window.storage !== 'undefined') && window.storage && typeof window.storage.set === 'function';
async function storageSet(key, value){
  if(hasClaudeStorage) return window.storage.set(key, value, false);
  localStorage.setItem(key, value);
  return {key, value};
}
async function storageGet(key){
  if(hasClaudeStorage) return window.storage.get(key, false);
  const v = localStorage.getItem(key);
  return v===null ? null : {key, value:v};
}
async function storageDelete(key){
  if(hasClaudeStorage) return window.storage.delete(key, false);
  localStorage.removeItem(key);
  return {key, deleted:true};
}
async function storageList(prefix){
  if(hasClaudeStorage) return window.storage.list(prefix, false);
  const keys = [];
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k && (!prefix || k.startsWith(prefix))) keys.push(k);
  }
  return {keys, prefix};
}

const STORAGE_KEY = 'tactics_board_v2';
async function saveBoard(){
  const status = document.getElementById('status');
  try{
    const data = JSON.stringify({entities, steps, nextBlueNum, nextRedNum});
    const res = await storageSet(STORAGE_KEY, data);
    status.textContent = res ? '✓ salvo' : 'falha ao salvar';
    setTimeout(()=>status.textContent='', 2000);
  }catch(e){ status.textContent = 'erro: ' + (e && e.message ? e.message : 'salvar'); console.error(e); }
}
async function loadBoard(){
  try{
    const res = await storageGet(STORAGE_KEY);
    if(res && res.value){
      const data = JSON.parse(res.value);
      entities = data.entities || [];
      steps = (data.steps && data.steps.length) ? data.steps : [{positions:{}}];
      currentStep = 0;
      nextBlueNum = data.nextBlueNum || 1; nextRedNum = data.nextRedNum || 1;
      idCounter = Math.max(1, ...entities.map(e=>e.id+1), 1);
      document.getElementById('addBall').disabled = !!entities.find(e=>e.team==='ball');
      recomputeAllStepsAutoFacing();
      updateStepUI(); draw(); refreshPovSelect();
    }
  }catch(e){}
}
document.getElementById('saveBtn').onclick = saveBoard;

document.getElementById('randomBtn').onclick = ()=>{
  const ball = entities.find(e=>e.team==='ball');
  entities.forEach(e=>{
    if(e.team==='ball') return;
    const pos = steps[currentStep].positions[e.id];
    if(pos){
      pos.x = 0.08 + Math.random()*0.84;
      pos.y = 0.08 + Math.random()*0.84;
    }
  });
  if(ball){
    const bp = steps[currentStep].positions[ball.id];
    if(bp){ bp.x = 0.5; bp.y = 0.5; }
  }
  recomputeAutoFacing(currentStep);
  const myPlayer = entities.find(e=>e.team==='blue') || entities.find(e=>e.team!=='ball');
  if(myPlayer) selectedId = myPlayer.id;
  draw();

  // vai direto pro 3D já no modo de controle, pra conduzir o jogador
  document.getElementById('goto3D').click();
  if(three && !three.controlMode) document.getElementById('controlModeBtn').click();

document.getElementById('randomPlayBtn').onclick = ()=>{
  let ball = entities.find(e=>e.team==='ball');
  if(!ball){
    const id = idCounter++;
    ball = {id, team:'ball', number:'', name:''};
    entities.push(ball);
  }
  const blues = entities.filter(e=>e.team==='blue');
  const reds = entities.filter(e=>e.team==='red');
  if(blues.length===0 || reds.length===0){
    alert('Precisa ter pelo menos 1 jogador azul e 1 vermelho em quadra pra gerar a jogada.');
    return;
  }

  const clamp01 = v => Math.max(0.05, Math.min(0.95, v));

  // reseta pra uma etapa inicial: azul no próprio campo atacando pra y=0 (o
  // gol), vermelho posicionado como defesa entre o azul e o gol.
  steps = [{positions:{}}];
  currentStep = 0;
  blues.forEach((e,i)=>{
    const x = blues.length>1 ? 0.15 + (i/(blues.length-1))*0.7 : 0.5;
    steps[0].positions[e.id] = {x: clamp01(x+(Math.random()-0.5)*0.06), y: clamp01(0.78+Math.random()*0.1), facingAngle:-Math.PI/2, customFacing:false};
  });
  reds.forEach((e,i)=>{
    const x = reds.length>1 ? 0.15 + (i/(reds.length-1))*0.7 : 0.5;
    steps[0].positions[e.id] = {x: clamp01(x+(Math.random()-0.5)*0.06), y: clamp01(0.28+Math.random()*0.12), facingAngle:Math.PI/2, customFacing:false};
  });

  // sorteia quem vai carregar a bola — esse é o jogador que você vai controlar
  const carrier = blues[Math.floor(Math.random()*blues.length)];
  steps[0].positions[ball.id] = {x: steps[0].positions[carrier.id].x, y: clamp01(steps[0].positions[carrier.id].y-0.03)};

  const NUM_STEPS = 6;
  for(let s=1; s<=NUM_STEPS; s++){
    const prev = steps[s-1].positions;
    const next = {};

    // o portador avança em direção ao gol, com leve drible lateral
    const cp = prev[carrier.id];
    const advance = 0.085 + Math.random()*0.06;
    const drift = (Math.random()-0.5)*0.12;
    const cx = clamp01(cp.x + drift);
    const cy = clamp01(cp.y - advance);
    next[carrier.id] = {x:cx, y:cy, facingAngle:cp.facingAngle, customFacing:false};
    next[ball.id] = {x:cx, y:clamp01(cy+0.02)};

    // apoio: os outros atacantes avançam junto, se espalhando pra abrir espaço
    blues.forEach(e=>{
      if(e.id===carrier.id) return;
      const p = prev[e.id];
      const adv = 0.05 + Math.random()*0.06;
      const lateral = (Math.random()-0.5)*0.06;
      next[e.id] = {x:clamp01(p.x+lateral), y:clamp01(p.y-adv), facingAngle:p.facingAngle, customFacing:false};
    });

    // defesa: o mais próximo fecha marcação em cima do portador, os outros recompõem
    let nearest = null, nearestDist = Infinity;
    reds.forEach(e=>{
      const p = prev[e.id];
      const d = Math.hypot(p.x-cx, p.y-cy);
      if(d<nearestDist){ nearestDist=d; nearest=e; }
    });
    reds.forEach(e=>{
      const p = prev[e.id];
      let tx, ty;
      if(nearest && e.id===nearest.id){
        const closeFactor = 0.55; // fecha em cima, mas não gruda 100%
        tx = p.x + (cx-p.x)*closeFactor;
        ty = p.y + (cy-p.y)*closeFactor;
      } else {
        tx = p.x + (Math.random()-0.5)*0.05;
        ty = p.y - 0.015 + Math.random()*0.03; // recompõe, cobrindo espaço
      }
      next[e.id] = {x:clamp01(tx), y:clamp01(ty), facingAngle:p.facingAngle, customFacing:false};
    });

    steps.push({positions:next});
  }

  recomputeAllStepsAutoFacing();
  currentStep = 0;
  selectedId = carrier.id;
  updateStepUI();
  draw();

  // vai pro 3D e já deixa reproduzindo a jogada — você entra no "🎮 Controlar"
  // quando quiser assumir a decisão
  document.getElementById('goto3D').click();
};

      console.error(e);
      btn.textContent = 'Erro: ' + (e && e.message ? e.message : 'tentar de novo');
      btn.disabled = false;
    }
  };
};

document.getElementById('loadMovementBtn').onclick = async ()=>{

    if(keys.length===0){ area.textContent = 'Nenhuma jogada salva ainda.'; return; }
    const items = [];
    for(const k of keys){
      try{
        const r = await storageGet(k);
        if(r && r.value) items.push({key:k, data: JSON.parse(r.value)});
      }catch(e){}
    }
    items.sort((a,b)=> (b.data.savedAt||0)-(a.data.savedAt||0));

      const stepCount = (item.data.steps||[]).length;
      row.innerHTML = `<div><span class="mname">${item.data.name || 'Sem nome'}</span><span class="mdate">${stepCount} etapas · ${dateStr}</span></div>

          <button class="loadBtn">Carregar</button>

      row.querySelector('.loadBtn').onclick = ()=>{
        entities = item.data.entities || [];

        currentStep = 0;
        nextBlueNum = item.data.nextBlueNum || 1; nextRedNum = item.data.nextRedNum || 1;
        idCounter = Math.max(1, ...entities.map(e=>e.id+1), 1);
        document.getElementById('addBall').disabled = !!entities.find(e=>e.team==='ball');
        recomputeAllStepsAutoFacing();
        updateStepUI(); draw(); refreshPovSelect();
        overlay.remove();
      };
      row.querySelector('.del').onclick = async (ev)=>{
        const delBtn = ev.currentTarget;
        if(delBtn.dataset.confirming!=='1'){
          delBtn.textContent = 'Confirmar?';
          delBtn.dataset.confirming = '1';
          return;
        }
        try{ await storageDelete(item.key); row.remove(); }catch(e){ console.error(e); }
      };
      area.appendChild(row);
    });
  }catch(e){
    console.error(e);
    area.textContent = 'Erro ao carregar as jogadas salvas.';
  }
};

let playing2D = false, playStart2D = 0, speed2D = 1;
function playLoop2D(){
  if(!playing2D) return;
  const durs = allDurations();
  const dur = totalDuration(durs);
  const elapsed = (performance.now()-playStart2D)/1000 * speed2D;
  const t = Math.min(elapsed, dur);
  document.getElementById('scrub').value = Math.round(t/dur*1000);
  drawCourt();
  entities.forEach(e=>{
    const pos = sampleEntityAt(e.id, t, durs, e.team==='ball');
    drawEntityAt(e, pos, true);
  });
  if(elapsed>=dur){ playing2D=false; document.getElementById('playBtn').textContent='▶ Reproduzir tudo'; return; }
  requestAnimationFrame(playLoop2D);
}
document.getElementById('playBtn').onclick = ()=>{
  if(playing2D){ playing2D=false; document.getElementById('playBtn').textContent='▶ Reproduzir tudo'; return; }
  if(steps.length<2){ return; }
  playing2D = true; playStart2D = performance.now();
  document.getElementById('playBtn').textContent = '⏸ Pausar';
  playLoop2D();
};

document.getElementById('stopBtn').onclick = ()=>{

let three = null;

function toWorld(fx, fy){
  return new THREE.Vector3((fy-0.5)*COURT_LEN, 0, -(fx-0.5)*COURT_WID);
}
function fromWorld(v){
  return { x: -(v.z/COURT_WID)+0.5, y: (v.x/COURT_LEN)+0.5 };
}

function buildSnapshot(){
  return {
    entities: entities.map(e=>({id:e.id, team:e.team, number:e.number, name:e.name, heightM:e.heightM}))
  };
}
function sample3D(id, t, durs, isBall){
  const p = sampleEntityAt(id, t, durs, isBall);
  if(!p) return null;
  const pos = toWorld(p.x,p.y);
  if(p.height) pos.y = p.height;
  return { pos, facingAngle: p.facingAngle ?? -Math.PI/2 };
}
function velocity3D(id, t, dt=0.05, durs, isBall){
  const a = sample3D(id, Math.max(0,t-dt), durs, isBall), b = sample3D(id, t+dt, durs, isBall);
  if(!a||!b) return new THREE.Vector3();
  return b.pos.clone().sub(a.pos).multiplyScalar(1/(2*dt));
}

function makeNumberTexture(text, team){
  const c = document.createElement('canvas');
  c.width = 128; c.height = 128;
  const ctx2 = c.getContext('2d');
  ctx2.fillStyle = team==='blue' ? '#3a5fd0' : '#c0392b';
  ctx2.beginPath(); ctx2.arc(64,64,58,0,Math.PI*2); ctx2.fill();
  ctx2.strokeStyle = 'rgba(255,255,255,0.85)'; ctx2.lineWidth = 5; ctx2.stroke();
  ctx2.fillStyle = '#fff';
  ctx2.font = '700 64px -apple-system, sans-serif';
  ctx2.textAlign = 'center'; ctx2.textBaseline = 'middle';
  ctx2.fillText(String(text||''), 64, 68);
  const tex = new THREE.CanvasTexture(c);
  tex.encoding = THREE.sRGBEncoding;
  return tex;
}
function makeWoodFloorTexture(){
  const c = document.createElement('canvas');
  c.width = 512; c.height = 512;
  const ctx2 = c.getContext('2d');
  const grad = ctx2.createLinearGradient(0,0,512,0);
  grad.addColorStop(0,'#c99f6b'); grad.addColorStop(0.5,'#dcb37e'); grad.addColorStop(1,'#c99f6b');
  ctx2.fillStyle = grad; ctx2.fillRect(0,0,512,512);
  const plankW = 42;
  for(let x=0; x<512; x+=plankW){
    // leve variação de tom por táboa
    ctx2.fillStyle = `rgba(${Math.random()<0.5?'90,60,30':'190,150,100'},${(Math.random()*0.05+0.02).toFixed(2)})`;
    ctx2.fillRect(x,0,plankW,512);
    ctx2.strokeStyle = 'rgba(90,60,30,0.35)';
    ctx2.lineWidth = 1.4;
    ctx2.beginPath(); ctx2.moveTo(x,0); ctx2.lineTo(x,512); ctx2.stroke();
    // veios da madeira
    for(let i=0;i<10;i++){
      const gy = Math.random()*512;
      ctx2.strokeStyle = 'rgba(90,60,30,0.10)';
      ctx2.lineWidth = 1;
      ctx2.beginPath();
      ctx2.moveTo(x+3, gy);
      ctx2.bezierCurveTo(x+plankW*0.3,gy+8, x+plankW*0.7,gy-8, x+plankW-3, gy+4);
      ctx2.stroke();
    }
    // juntas horizontais das táboas (efeito assoalho)
    for(let y=0;y<512;y+=128){
      ctx2.strokeStyle = 'rgba(90,60,30,0.18)';
      ctx2.beginPath(); ctx2.moveTo(x,y); ctx2.lineTo(x+plankW,y); ctx2.stroke();
    }
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
  tex.encoding = THREE.sRGBEncoding;
  tex.repeat.set(COURT_LEN/9, COURT_WID/9);
  return tex;
}

function makeSoccerBallTexture(){
  const c = document.createElement('canvas');
  c.width = 256; c.height = 128;
  const ctx2 = c.getContext('2d');
  ctx2.fillStyle = '#f4f4f4'; ctx2.fillRect(0,0,256,128);
  ctx2.fillStyle = '#1a1a1a';
  const pent = (cx,cy,r)=>{
    ctx2.beginPath();
    for(let i=0;i<5;i++){
      const a = -Math.PI/2 + i*(Math.PI*2/5);
      const x = cx+Math.cos(a)*r, y = cy+Math.sin(a)*r;
      i===0?ctx2.moveTo(x,y):ctx2.lineTo(x,y);
    }
    ctx2.closePath(); ctx2.fill();
  };
  [[32,20],[96,16],[160,24],[224,18],[16,64],[80,60],[144,66],[208,60],[48,108],[112,112],[176,106],[240,110]]
    .forEach(([x,y])=>pent(x,y,13));
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
  tex.encoding = THREE.sRGBEncoding;
  return tex;
}

function makePlayerMesh(team, numberText, heightM){
  const g = new THREE.Group();
  const color = team==='blue' ? 0x3a5fd0 : team==='red' ? 0xc0392b : 0xaaaaaa;
  const mat = new THREE.MeshLambertMaterial({color});
  const skinMat = new THREE.MeshLambertMaterial({color:0xd8a878});
  const shortsMat = new THREE.MeshLambertMaterial({color:0xf2f2f2});
  const shoeMat = new THREE.MeshLambertMaterial({color:0x161616});

  // sombra de contato — dá a sensação de peso real no chão
  const shadowMat = new THREE.MeshBasicMaterial({color:0x000000, transparent:true, opacity:0.32, depthWrite:false});
  const shadowBlob = new THREE.Mesh(new THREE.CircleGeometry(0.32,16), shadowMat);
  shadowBlob.rotation.x = -Math.PI/2;
  shadowBlob.position.y = 0.015;
  g.add(shadowBlob);

  const torsoPivot = new THREE.Group();
  torsoPivot.position.y = 0.72;
  g.add(torsoPivot);
  const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.19,0.6,10), mat);
  torso.position.y = 0.31; torsoPivot.add(torso);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.135,12,10), skinMat);
  head.position.y = 0.77; torsoPivot.add(head);

  if(numberText){
    const numTex = makeNumberTexture(numberText, team);
    const numMat = new THREE.MeshBasicMaterial({map:numTex, transparent:true});
    const front = new THREE.Mesh(new THREE.PlaneGeometry(0.24,0.24), numMat);
    front.position.set(0,0.34,0.201);
    torsoPivot.add(front);
    const back = new THREE.Mesh(new THREE.PlaneGeometry(0.24,0.24), numMat);
    back.position.set(0,0.34,-0.201); back.rotation.y = Math.PI;
    torsoPivot.add(back);
  }

  const legs = [], arms = [], knees = [], elbows = [];
  for(const s of [-1,1]){
    const legPivot = new THREE.Group();
    legPivot.position.set(s*0.11, 0.72, 0);
    // calção
    const shorts = new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.063,0.14,8), shortsMat);
    shorts.position.y = -0.07; legPivot.add(shorts);
    // coxa (pele)
    const thigh = new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.054,0.26,8), skinMat);
    thigh.position.y = -0.27; legPivot.add(thigh);
    const kneePivot = new THREE.Group();
    kneePivot.position.set(0,-0.38,0);
    legPivot.add(kneePivot);
    // meião (cor do time)
    const shin = new THREE.Mesh(new THREE.CylinderGeometry(0.048,0.04,0.36,8), mat);
    shin.position.y = -0.18; kneePivot.add(shin);
    // chuteira
    const foot = new THREE.Mesh(new THREE.BoxGeometry(0.075,0.045,0.15), shoeMat);
    foot.position.set(0,-0.36,0.04); kneePivot.add(foot);
    g.add(legPivot); legs.push(legPivot); knees.push(kneePivot);

    const armPivot = new THREE.Group();
    armPivot.position.set(s*0.24, 0.56, 0);
    const upperArm = new THREE.Mesh(new THREE.CylinderGeometry(0.045,0.041,0.3,8), mat);
    upperArm.position.y = -0.15; armPivot.add(upperArm);
    const elbowPivot = new THREE.Group();
    elbowPivot.position.set(0,-0.3,0);
    armPivot.add(elbowPivot);
    const forearm = new THREE.Mesh(new THREE.CylinderGeometry(0.037,0.032,0.27,8), skinMat);
    forearm.position.y = -0.135; elbowPivot.add(forearm);
    torsoPivot.add(armPivot); arms.push(armPivot); elbows.push(elbowPivot);
  }
  g.userData.rig = {torsoPivot, legs, arms, knees, elbows};
  g.traverse(o=>{ if(o.isMesh){ o.castShadow = true; } });
  // altura do modelo sem escala ≈ 1.625m (até o topo da cabeça); escala pra
  // bater com a altura real sorteada pra esse jogador (1.70-1.80m)
  g.scale.setScalar((heightM || 1.75) / 1.625);
  return g;
}

function initThree(){
  const wrap = document.getElementById('v3dCanvasWrap');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1b1b1b);
  scene.fog = new THREE.Fog(0x1b1b1b, 40, 130);
  const renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 1.5));
  renderer.setSize(wrap.clientWidth, wrap.clientHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.gammaFactor = 2.2;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;
  wrap.appendChild(renderer.domElement);
  renderer.domElement.addEventListener('webglcontextlost', (ev)=>{
    ev.preventDefault();
    console.error('Contexto WebGL perdido');
    if(three) showViewer3DError();
  });
  renderer.domElement.addEventListener('webglcontextrestored', ()=>{
    if(three){ try{ rebuild3DScene(); }catch(e){ console.error(e); } }
  });
  renderer.domElement.style.touchAction = 'none';

  // ---- olhar livre: arraste na tela pra virar a cabeça, 360°, mesmo durante a reprodução ----
  let lookDrag = null;
  renderer.domElement.addEventListener('pointerdown', (ev)=>{
    lookDrag = {x: ev.clientX, y: ev.clientY};
    renderer.domElement.setPointerCapture(ev.pointerId);
  });
  renderer.domElement.addEventListener('pointermove', (ev)=>{
    if(!lookDrag || !three) return;
    const dx = ev.clientX - lookDrag.x, dy = ev.clientY - lookDrag.y;
    lookDrag = {x: ev.clientX, y: ev.clientY};
    const sens = 0.0065;
    three.freeLookYaw = (three.freeLookYaw||0) - dx*sens;
    three.freeLookPitch = Math.max(-1.3, Math.min(1.3, (three.freeLookPitch||0) - dy*sens));
  });
  renderer.domElement.addEventListener('pointerup', ()=>{ lookDrag = null; });
  renderer.domElement.addEventListener('pointercancel', ()=>{ lookDrag = null; });

  const camera = new THREE.PerspectiveCamera(72, wrap.clientWidth/wrap.clientHeight, 0.05, 300);

  scene.add(new THREE.AmbientLight(0x888888, 0.75));
  const dl = new THREE.DirectionalLight(0xffffff, 0.75);
  dl.castShadow = true;
  dl.shadow.mapSize.set(512,512);
  dl.shadow.camera.left = -COURT_LEN/2-4; dl.shadow.camera.right = COURT_LEN/2+4;
  dl.shadow.camera.top = COURT_WID/2+4; dl.shadow.camera.bottom = -COURT_WID/2-4;
  dl.shadow.camera.near = 1; dl.shadow.camera.far = 60;
  dl.shadow.bias = -0.0015;
  dl.position.set(10,25,10); scene.add(dl);

  [[-COURT_LEN*0.25,14,-COURT_WID*0.3],[COURT_LEN*0.25,14,COURT_WID*0.3]].forEach(p=>{
    const sp = new THREE.PointLight(0xfff4e0, 0.35, 45);
    sp.position.set(p[0],p[1],p[2]);
    scene.add(sp);
  });

  const HL = COURT_LEN/2, HW = COURT_WID/2;

  const courtMat = new THREE.MeshLambertMaterial({map: makeWoodFloorTexture()});
  const courtPlane = new THREE.Mesh(new THREE.PlaneGeometry(COURT_LEN, COURT_WID), courtMat);
  courtPlane.rotation.x = -Math.PI/2; courtPlane.receiveShadow = true; scene.add(courtPlane);

  // ---- áreas coloridas (círculo central e áreas do gol) — preenchimento
  // sólido que recebe a cor escolhida pelo usuário. As LINHAS de contorno
  // (lateral, meio-de-campo, área, pênalti) ficam SEMPRE brancas, à parte.
  function buildFilledArea(points, color, yPos=0.012){
    const shape = new THREE.Shape();
    points.forEach(([x,z], i)=>{
      if(i===0) shape.moveTo(x, -z); else shape.lineTo(x, -z);
    });
    const geom = new THREE.ShapeGeometry(shape);
    const mat = new THREE.MeshBasicMaterial({color, side:THREE.DoubleSide, depthWrite:false});
    const mesh = new THREE.Mesh(geom, mat);
    mesh.rotation.x = -Math.PI/2;
    mesh.position.y = yPos;
    scene.add(mesh);
    return mesh;
  }

  function addLine(points, color=0xffffff){
    const g = new THREE.BufferGeometry().setFromPoints(points.map(p=>new THREE.Vector3(p[0],0.02,p[1])));
    scene.add(new THREE.Line(g, new THREE.LineBasicMaterial({color})));
  }
  addLine([[-HL,-HW],[HL,-HW],[HL,HW],[-HL,HW],[-HL,-HW]]);
  addLine([[0,-HW],[0,HW]]);

  // círculo central: contorno branco (linha) + preenchimento colorido por baixo
  const centerCirclePts = [];
  for(let i=0;i<=64;i++){ const a=i/64*Math.PI*2; centerCirclePts.push([Math.cos(a)*3, Math.sin(a)*3]); }
  addLine(centerCirclePts);
  const centerFill = buildFilledArea(centerCirclePts, 0xffffff, 0.011);

  // área de meta oficial: dois arcos de 6m de raio (centrados em cada poste),
  // ligados por uma reta — não é um retângulo.
  function arcPts(cx, cz, r, a0, a1, n){
    const pts = [];
    for(let i=0;i<=n;i++){ const a = a0+(a1-a0)*(i/n); pts.push([cx+Math.cos(a)*r, cz+Math.sin(a)*r]); }
    return pts;
  }
  function goalAreaLine(xSign){
    const r = 6, postZ = 1.5, n = 14;
    const arcA = arcPts(0, -postZ, r, -Math.PI/2, -Math.PI, n);   // poste em z=-1.5
    const arcB = arcPts(0, postZ, r, Math.PI/2, Math.PI, n);      // poste em z=+1.5
    const local = [...arcA, ...arcB.slice().reverse()];
    return local.map(([lx,lz])=>[xSign*(HL+lx), lz]);
  }
  const goalArea1Pts = goalAreaLine(1);
  const goalArea2Pts = goalAreaLine(-1);
  addLine(goalArea1Pts);
  addLine(goalArea2Pts);
  const goalArea1Fill = buildFilledArea(goalArea1Pts, 0xffffff, 0.011);
  const goalArea2Fill = buildFilledArea(goalArea2Pts, 0xffffff, 0.011);

  // marca do pênalti (6m da linha de gol) e do segundo pênalti (10m) — sempre brancas
  [1,-1].forEach(xSign=>{
    [6,10].forEach(dist=>{
      const p = new THREE.Mesh(new THREE.CircleGeometry(0.06,12), new THREE.MeshBasicMaterial({color:0xffffff}));
      p.rotation.x = -Math.PI/2; p.position.set(xSign*(HL-dist), 0.021, 0);
      scene.add(p);
    });
  });

  addLine([[HL,-1.5],[HL,1.5]],0xffffff);
  addLine([[-HL,-1.5],[-HL,1.5]],0xffffff);

  // gol simples (postes + travessão)
  function buildGoalFrame(xSign){
    const group = new THREE.Group();
    const postMat = new THREE.MeshLambertMaterial({color:0xf2f2f2});
    const postR = 0.06, gw = 3, gh = 2;
    const xFace = xSign*HL;
    [-gw/2, gw/2].forEach(z=>{
      const post = new THREE.Mesh(new THREE.CylinderGeometry(postR,postR,gh,8), postMat);
      post.position.set(xFace, gh/2, z); group.add(post);
    });
    const cross = new THREE.Mesh(new THREE.CylinderGeometry(postR,postR,gw,8), postMat);
    cross.rotation.z = Math.PI/2; cross.position.set(xFace, gh, 0); group.add(cross);
    return group;
  }
  scene.add(buildGoalFrame(1));
  scene.add(buildGoalFrame(-1));

  // ---- arquibancada de verdade (fileiras), dos dois lados — cada lado pode
  // ser ligado/desligado independente, e cada lado também pode ter um banco
  // de reservas em vez de (ou junto com) a arquibancada.
  function buildBleachers(zSign){
    const rows = 6, rowH = 0.42, rowD = 0.8;
    const seatMat = new THREE.MeshLambertMaterial({color:0x2c2c2c});
    const group = new THREE.Group();
    const spanL = HL + 5;
    for(let r=0;r<rows;r++){
      const step = new THREE.Mesh(new THREE.BoxGeometry(spanL*2, rowH, rowD), seatMat);
      step.position.set(0, rowH/2 + r*rowH, zSign*(HW + 0.6 + r*rowD));
      step.receiveShadow = true;
      group.add(step);
    }
    return group;
  }
  function buildBench(zSign){
    const group = new THREE.Group();
    const benchMatBlue = new THREE.MeshLambertMaterial({color:0x2e4a7a});
    const benchMatRed = new THREE.MeshLambertMaterial({color:0x7a2e2e});
    [[-7, benchMatBlue],[7, benchMatRed]].forEach(([xOff, mat])=>{
      const seat = new THREE.Mesh(new THREE.BoxGeometry(4.4, 0.5, 0.8), mat);
      seat.position.set(xOff, 0.25, zSign*(HW+0.9));
      seat.castShadow = true; seat.receiveShadow = true;
      group.add(seat);
      const backrest = new THREE.Mesh(new THREE.BoxGeometry(4.4, 0.85, 0.06), mat);
      backrest.position.set(xOff, 0.65, zSign*(HW+0.9+zSign*0.37));
      group.add(backrest);
    });
    return group;
  }
  const bleachers1 = buildBleachers(1);
  const bleachers2 = buildBleachers(-1);
  scene.add(bleachers1);
  scene.add(bleachers2);
  const bench1 = buildBench(1);
  const bench2 = buildBench(-1);
  bench1.visible = false; bench2.visible = false; // começam desligados
  scene.add(bench1);
  scene.add(bench2);
  const BLEACHER_DEPTH = 6*0.8 + 0.6; // até onde as fileiras vão

  // ---- fundos: gol (2 lados independentes), arquibancada (2 lados
  // independentes), teto e banners (2 lados). Ficam próximos da quadra, e
  // quando uma foto é carregada a geometria é ajustada pra proporção real da
  // imagem (sem esticar).
  function buildBackdropSingle(baseW, baseH, positionFn, color=0x2a2a2a, startHidden=false){
    const mat = new THREE.MeshBasicMaterial({color, side:THREE.DoubleSide});
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(baseW, baseH), mat);
    positionFn(mesh);
    mesh.visible = !startHidden;
    scene.add(mesh);
    return {segments:[{mat, baseW, baseH, mesh}]};
  }

  const goal1Backdrop = buildBackdropSingle(COURT_WID+8, 11, (m)=>{
    m.position.set(HL+1.8, 11/2-0.3, 0); m.rotation.y = -Math.PI/2;
  });
  const goal2Backdrop = buildBackdropSingle(COURT_WID+8, 11, (m)=>{
    m.position.set(-HL-1.8, 11/2-0.3, 0); m.rotation.y = Math.PI/2;
  });
  const stand1Backdrop = buildBackdropSingle(COURT_LEN+12, 12, (m)=>{
    m.position.set(0, 12/2-0.3, HW+BLEACHER_DEPTH+1.2); m.rotation.y = Math.PI;
  });
  const stand2Backdrop = buildBackdropSingle(COURT_LEN+12, 12, (m)=>{
    m.position.set(0, 12/2-0.3, -HW-BLEACHER_DEPTH-1.2);
  });
  const roofBackdrop = buildBackdropSingle(COURT_LEN+30, COURT_WID+30, (m)=>{
    m.position.set(0, 13.5, 0); m.rotation.x = Math.PI/2;
  }, 0x1c1c1c);

  // ---- banners: só nos 2 lados (não atrás do gol), invisíveis até você
  // mandar uma foto — cada lado é independente.
  const bannerH = 0.9;
  const banner1Backdrop = buildBackdropSingle(COURT_LEN+0.6, bannerH, (m)=>{
    m.position.set(0, bannerH/2+0.02, HW+0.12); m.rotation.y = Math.PI;
  }, 0x333333, true);
  const banner2Backdrop = buildBackdropSingle(COURT_LEN+0.6, bannerH, (m)=>{
    m.position.set(0, bannerH/2+0.02, -HW-0.12);
  }, 0x333333, true);

  three = {
    scene, renderer, camera, wrap, meshes:{}, t:0, playing:true, speed:1,
    shakeSeed:Math.random()*1000, povId:null, lastFrame:performance.now(),
    freeLookYaw:0, freeLookPitch:0, isRecording:false,
    controlMode:false, manualPos:null, manualYaw:0, manualBallPos:null, passAnim:null, frozenPositions:{},
    envImages:{},
    backdrops:{ goal1:goal1Backdrop, goal2:goal2Backdrop, stand1:stand1Backdrop, stand2:stand2Backdrop, roof:roofBackdrop, banner1:banner1Backdrop, banner2:banner2Backdrop },
    sideExtras:{ bleachers1, bleachers2, bench1, bench2 },
    courtMat,
    areaFills:[centerFill, goalArea1Fill, goalArea2Fill],
    transition:null
  };

  window.addEventListener('resize', ()=>{
    if(!three) return;
    three.camera.aspect = three.wrap.clientWidth/three.wrap.clientHeight;
    three.camera.updateProjectionMatrix();
    three.renderer.setSize(three.wrap.clientWidth, three.wrap.clientHeight);
  });
}

function rebuild3DScene(){
  Object.values(three.meshes).forEach(m=>three.scene.remove(m));
  three.meshes = {};
  three.snap = buildSnapshot();
  three.snap.entities.forEach(e=>{
    if(e.team==='ball'){
      const ballTex = makeSoccerBallTexture();
      const ballMesh = new THREE.Mesh(new THREE.SphereGeometry(0.14,20,20), new THREE.MeshStandardMaterial({map:ballTex, roughness:0.6}));
      ballMesh.castShadow = true;
      three.scene.add(ballMesh);
      three.meshes[e.id] = ballMesh;
    } else {
      const mesh = makePlayerMesh(e.team, e.number, e.heightM || randomHeightM());
      three.scene.add(mesh);
      three.meshes[e.id] = mesh;
    }
  });
  refreshPovSelect();
}

function refreshPovSelect(){
  const sel = document.getElementById('povSelect');
  if(!sel) return;
  sel.innerHTML = '';
  entities.filter(e=>e.team!=='ball').forEach(e=>{
    const opt = document.createElement('option');
    opt.value = e.id;
    opt.textContent = `${e.team==='blue'?'Azul':'Vermelho'} #${e.number}${e.name?' · '+e.name:''}`;
    sel.appendChild(opt);
  });
  if(three && (three.povId==null || !entities.find(e=>e.id===three.povId && e.team!=='ball'))){
    const first = entities.find(e=>e.team!=='ball');
    three.povId = first ? first.id : null;
    if(three.povId!=null) sel.value = three.povId;
  }
}

function startCameraTransition(){
  if(!three) return;
  three.transition = {t0: performance.now(), fromPos: three.camera.position.clone(), fromQuat: three.camera.quaternion.clone()};
}

function animate3D(){
  if(!three) return;
  requestAnimationFrame(animate3D);
  try{
    const now = performance.now();
    const dt = Math.min((now-three.lastFrame)/1000, 0.05);
    three.lastFrame = now;
    if(three.controlMode){
      renderControlFrame(dt);
      three.renderer.render(three.scene, three.camera);
      return;
    }
    const durs = allDurations();
    const dur = totalDuration(durs);
    if(three.playing){
      three.t += dt*three.speed;
      if(three.t>dur){
        if(three.isRecording){
          three.t = dur;
          stopRecordingManual();
        } else {
          // repete sozinho em loop, sem precisar voltar e clicar de novo
          three.t = 0;
          three.transition = null;
        }
      }
      document.getElementById('scrub3D').value = Math.round(three.t/dur*1000);
    }
    const tt = three.t;
    document.getElementById('time3DLabel').textContent = `${tt.toFixed(1)}s / ${dur.toFixed(1)}s`;
    render3DFrame(tt, dur, durs);
  }catch(err){
    console.error('Erro no render 3D:', err);
    showViewer3DError();
  }
}

let moveInput = {fwd:false, back:false, left:false, right:false};

function renderControlFrame(dt){
  const povEntity = three.snap.entities.find(e=>e.id===three.povId);
  if(!povEntity || !three.manualPos) return;

  const runSpeed = 6.5;
  const yaw = three.manualYaw + (three.freeLookYaw||0);
  const fwdDir = new THREE.Vector3(Math.sin(yaw),0,-Math.cos(yaw));
  const rightDir = new THREE.Vector3(Math.sin(yaw+Math.PI/2),0,-Math.cos(yaw+Math.PI/2));

  const moveVec = new THREE.Vector3();
  if(moveInput.fwd) moveVec.add(fwdDir);
  if(moveInput.back) moveVec.sub(fwdDir);
  if(moveInput.right) moveVec.add(rightDir);
  if(moveInput.left) moveVec.sub(rightDir);
  let speed = 0;
  if(moveVec.lengthSq()>0){
    moveVec.normalize();
    three.manualPos.add(moveVec.multiplyScalar(runSpeed*dt));
    speed = runSpeed;
  }
  const HLc = COURT_LEN/2-0.5, HWc = COURT_WID/2-0.5;
  three.manualPos.x = Math.max(-HLc, Math.min(HLc, three.manualPos.x));
  three.manualPos.z = Math.max(-HWc, Math.min(HWc, three.manualPos.z));

  const eyeHeight = 1.68;
  const basePos = three.manualPos.clone(); basePos.y = eyeHeight;
  const spdFrac = Math.min(speed/9.2,1);
  const bobFreq = 1.9 + spdFrac*2.6;
  const phase = performance.now()/1000*bobFreq*Math.PI*2 + three.shakeSeed;
  const bobAmt = 0.03 + spdFrac*0.22;
  const swayAmt = 0.012 + spdFrac*0.075;
  basePos.y += Math.sin(phase)*bobAmt;
  basePos.x += Math.cos(phase*0.5)*swayAmt;
  three.camera.position.copy(basePos);

  const dir = new THREE.Vector3(Math.sin(yaw),0,-Math.cos(yaw));
  let pitch = -0.03 - Math.min(speed,8)*0.03 + (three.freeLookPitch||0);
  pitch = Math.max(-1.3, Math.min(1.3, pitch));
  const target = basePos.clone().add(dir.multiplyScalar(5));
  target.y = basePos.y + Math.tan(pitch)*5;
  three.camera.up.set(0,1,0);
  three.camera.lookAt(target);

  three.snap.entities.forEach(e=>{
    if(e.id===three.povId || e.team==='ball') return;
    const mesh = three.meshes[e.id];
    if(!mesh) return;
    const fp = three.frozenPositions[e.id];
    if(fp) mesh.position.copy(fp);
    mesh.visible = true;
  });
  if(three.meshes[three.povId]) three.meshes[three.povId].visible = false;

  const ballEnt = three.snap.entities.find(e=>e.team==='ball');
  if(ballEnt){
    const ballMesh = three.meshes[ballEnt.id];
    if(three.passAnim){
      const elapsed = performance.now() - three.passAnim.start;
      const u = Math.min(1, elapsed/three.passAnim.duration);
      const pos = three.passAnim.from.clone().lerp(three.passAnim.to, u);
      if(ballMesh) ballMesh.position.copy(pos);
      if(u>=1){
        three.manualBallPos = three.passAnim.to.clone();
        three.passAnim = null;
      }
    } else if(ballMesh && three.manualBallPos){
      ballMesh.position.copy(three.manualBallPos);
    }
  }
}

function showViewer3DError(){

function render3DFrame(tt, dur, durs){
  let povSample = null, povVel = null;
  three.snap.entities.forEach(e=>{
    const s = sample3D(e.id, tt, durs, e.team==='ball');
    if(!s) return;
    const mesh = three.meshes[e.id];
    mesh.position.copy(s.pos);
    if(e.team!=='ball'){
      const v = velocity3D(e.id, tt, 0.05, durs);
      if(e.id===three.povId){ povSample = s; povVel = v; }
      const spd = v.length();
      // corpo aponta pra direção do movimento; se parado, usa o ângulo definido na prancha
      mesh.rotation.y = spd>0.3 ? Math.atan2(v.x, v.z) : s.facingAngle;
      const rig = mesh.userData.rig;
      if(rig){
        const spdFrac = Math.min(spd/9.2, 1);
        const freq = 1.7 + spdFrac*2.6;
        const amp = 0.14 + spdFrac*0.55;
        const phase = tt*freq*Math.PI*2 + (e.id*1.7);
        const swing = Math.sin(phase);
        rig.legs[0].rotation.x = swing*amp;
        rig.legs[1].rotation.x = -swing*amp;
        rig.arms[0].rotation.x = -swing*amp*0.7;
        rig.arms[1].rotation.x = swing*amp*0.7;
        rig.torsoPivot.rotation.x = spdFrac*0.22;
        rig.torsoPivot.rotation.y = swing*0.06*spdFrac; // leve torção do tronco, contrária às pernas
        mesh.position.y += Math.abs(Math.cos(phase))*spdFrac*0.04;

        // joelhos e cotovelos dobram de forma coordenada com a passada,
        // acompanhando o mesmo ritmo das pernas/braços (sem exagero)
        const kneeBase = 0.1;
        const kneeAmp = spdFrac*0.9;
        rig.knees[0].rotation.x = kneeBase + Math.max(0, Math.sin(phase))*kneeAmp;
        rig.knees[1].rotation.x = kneeBase + Math.max(0, -Math.sin(phase))*kneeAmp;
        const elbowAmp = 0.2 + spdFrac*0.35;
        rig.elbows[0].rotation.x = 0.28 + Math.max(0, -swing)*elbowAmp;
        rig.elbows[1].rotation.x = 0.28 + Math.max(0, swing)*elbowAmp;
      }
    }
  });

  const povEntity = three.snap.entities.find(e=>e.id===three.povId);
  if(povEntity && povSample){
    const s = povSample;
    const v = povVel;
    const speedA = Math.min(v.length(), 11);
    const eyeHeight = 1.68;
    const basePos = s.pos.clone(); basePos.y = eyeHeight;

    const spdFrac = Math.min(speedA/9.2, 1);
    const bobFreq = 1.9 + spdFrac*2.6;
    const phase = tt*bobFreq*Math.PI*2 + three.shakeSeed;
    const bobAmt = 0.03 + spdFrac*0.22;
    const swayAmt = 0.012 + spdFrac*0.075;
    basePos.y += Math.sin(phase)*bobAmt;
    basePos.x += Math.cos(phase*0.5)*swayAmt;

    three.camera.position.copy(basePos);

    // direção base = ângulo definido na prancha, mais o quanto o usuário girou
    // a cabeça arrastando na tela (olhar livre, 360°, mesmo durante o lance).
    const yaw = s.facingAngle + (three.freeLookYaw||0);
    const dir = new THREE.Vector3(Math.sin(yaw), 0, -Math.cos(yaw));
    let pitch = -0.03 - Math.min(speedA,8)*0.03 + (three.freeLookPitch||0);

    pitch = Math.max(-1.3, Math.min(1.3, pitch));
    const target = basePos.clone().add(dir.multiplyScalar(5));
    target.y = basePos.y + Math.tan(pitch)*5;
    three.camera.up.set(0,1,0);
    three.camera.lookAt(target);
    three.camera.rotation.z += Math.sin(phase)*0.006*spdFrac;

    three.snap.entities.forEach(e=>{
      if(three.meshes[e.id]) three.meshes[e.id].visible = (e.id!==povEntity.id);
    });
  }

  if(three.transition){
    const elapsed = performance.now() - three.transition.t0;
    const fDur = 380;
    const f = Math.min(1, elapsed/fDur);
    const fe = f*f*(3-2*f);
    const targetPos = three.camera.position.clone();
    const targetQuat = three.camera.quaternion.clone();
    three.camera.position.lerpVectors(three.transition.fromPos, targetPos, fe);
    three.camera.quaternion.slerpQuaternions(three.transition.fromQuat, targetQuat, fe);
    if(f>=1) three.transition = null;
  }

  three.renderer.render(three.scene, three.camera);
}

// ---------------------------------------------------------------------------
// GRAVAR o lance em 3D e salvar/compartilhar (vai pra galeria via a folha de
// compartilhamento do celular, quando o navegador suportar).
// ---------------------------------------------------------------------------
let mediaRecorder = null, recordedChunks = [];
function pickMimeType(){
  const options = ['video/mp4', 'video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'];
  for(const t of options){ if(window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) return t; }
  return '';
}
function startRecording(){
  if(!three || !three.renderer.domElement.captureStream){
    alert('Esse navegador não suporta gravar direto. Tente atualizar o app/navegador, ou grave a tela pelo recurso nativo do celular.');
    return;
  }
  const stream = three.renderer.domElement.captureStream(30);
  const mimeType = pickMimeType();
  recordedChunks = [];
  try{
    mediaRecorder = mimeType ? new MediaRecorder(stream, {mimeType}) : new MediaRecorder(stream);
  }catch(e){
    console.error(e);
    alert('Não consegui iniciar a gravação nesse navegador.');
    return;
  }
  mediaRecorder.ondataavailable = (e)=>{ if(e.data && e.data.size>0) recordedChunks.push(e.data); };
  mediaRecorder.onstop = onRecordingStop;
  mediaRecorder.start();
  three.isRecording = true;
  // recomeça o lance do zero, do primeiro ao último instante, pra gravar completo
  three.t = 0; three.playing = true; three.transition = null;
  document.getElementById('play3DBtn').textContent = '⏸ Pausar';
  document.getElementById('record3DBtn').textContent = '⏹ Parar gravação';
  document.getElementById('record3DBtn').style.background = '#7a2020';
}
function stopRecordingManual(){
  three.isRecording = false;
  if(mediaRecorder && mediaRecorder.state!=='inactive') mediaRecorder.stop();
  document.getElementById('record3DBtn').textContent = '⏺ Gravar';
  document.getElementById('record3DBtn').style.background = '#4a2020';
}
async function onRecordingStop(){
  if(recordedChunks.length===0) return;
  const blob = new Blob(recordedChunks, {type: recordedChunks[0].type || 'video/webm'});
  const ext = blob.type.includes('mp4') ? 'mp4' : 'webm';
  const file = new File([blob], `lance-3d.${ext}`, {type: blob.type});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{
      await navigator.share({files:[file], title:'Lance 3D'});
      return;
    }catch(e){ /* usuário cancelou o compartilhamento — cai pro download abaixo */ }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `lance-3d.${ext}`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 8000);
}
document.getElementById('record3DBtn').onclick = ()=>{
  if(three.isRecording) stopRecordingManual();
  else startRecording();
};

// ---------------------------------------------------------------------------
// Comprime e redimensiona a imagem antes de gerar o dataURL, evitando que
// fotos de câmera (3-5MB cada) estourem o limite de salvamento do ambiente.
// ---------------------------------------------------------------------------
function compressImageFile(file, maxDim = 1600, quality = 0.75){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let {width, height} = img;
        if(width > height && width > maxDim){ height = height*(maxDim/width); width = maxDim; }
        else if(height > maxDim){ width = width*(maxDim/height); height = maxDim; }
        const c = document.createElement('canvas');
        c.width = Math.round(width); c.height = Math.round(height);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function applySegmentTexture(seg, sourceTex, imgAspect){
  const tex = sourceTex.clone();
  tex.image = sourceTex.image;
  tex.needsUpdate = true;
  tex.encoding = THREE.sRGBEncoding;
  tex.wrapS = THREE.ClampToEdgeWrapping; tex.wrapT = THREE.ClampToEdgeWrapping;
  const panelAspect = seg.baseW / seg.baseH;
  if(imgAspect > panelAspect){
    const scale = panelAspect / imgAspect;
    tex.repeat.set(scale, 1); tex.offset.set((1-scale)/2, 0);
  } else {
    const scale = imgAspect / panelAspect;
    tex.repeat.set(1, scale); tex.offset.set(0, (1-scale)/2);
  }
  seg.mat.map = tex; seg.mat.color.set(0xffffff); seg.mat.needsUpdate = true;
  if(seg.mesh) seg.mesh.visible = true; // banners só aparecem quando ganham uma foto
}
function applyBackdropPhoto(key, dataURL){
  const img = new Image();
  img.onload = ()=>{
    const tex = new THREE.Texture(img);
    tex.needsUpdate = true;
    const imgAspect = img.naturalWidth / img.naturalHeight;
    const bd = three.backdrops[key];
    if(bd && bd.segments) bd.segments.forEach(seg=>applySegmentTexture(seg, tex, imgAspect));
    three.envImages[key] = dataURL;
  };
  img.src = dataURL;
}
function wireBackdropUpload(btnId, inputId, key){
  document.getElementById(btnId).onclick = ()=> document.getElementById(inputId).click();
  document.getElementById(inputId).addEventListener('change', async (ev)=>{
    const file = ev.target.files[0];
    if(!file || !three) return;
    const btn = document.getElementById(btnId);
    const originalLabel = btn.textContent;
    btn.textContent = 'Processando...';
    try{
      const dataURL = await compressImageFile(file, 1600, 0.75);
      applyBackdropPhoto(key, dataURL);
    }catch(e){
      console.error(e);
      alert('Não consegui processar essa imagem.');
    }finally{
      btn.textContent = originalLabel;
      ev.target.value = '';
    }
  });
}
wireBackdropUpload('bgGoal1Btn','bgGoal1Input','goal1');
wireBackdropUpload('bgGoal2Btn','bgGoal2Input','goal2');
wireBackdropUpload('bgStand1Btn','bgStand1Input','stand1');
wireBackdropUpload('bgStand2Btn','bgStand2Input','stand2');
wireBackdropUpload('bgRoofBtn','bgRoofInput','roof');
wireBackdropUpload('bgBanner1Btn','bgBanner1Input','banner1');
wireBackdropUpload('bgBanner2Btn','bgBanner2Input','banner2');

// ---- foto do piso: substitui a madeira procedural pela foto real da quadra ----
function applyFloorPhoto(dataURL){
  const img = new Image();
  img.onload = ()=>{
    const tex = new THREE.Texture(img);
    tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(6,3);
    tex.encoding = THREE.sRGBEncoding;
    tex.needsUpdate = true;
    three.courtMat.map = tex;
    three.courtMat.color.set(0xffffff);
    three.courtMat.needsUpdate = true;
    three.envImages.floor = dataURL;
  };
  img.src = dataURL;
}
document.getElementById('bgFloorBtn').onclick = ()=> document.getElementById('bgFloorInput').click();
document.getElementById('bgFloorInput').addEventListener('change', async (ev)=>{
  const file = ev.target.files[0];
  if(!file || !three) return;
  const btn = document.getElementById('bgFloorBtn');
  const originalLabel = btn.textContent;
  btn.textContent = 'Processando...';
  try{
    const dataURL = await compressImageFile(file, 1200, 0.75);
    applyFloorPhoto(dataURL);
  }catch(e){
    console.error(e);
    alert('Não consegui processar essa imagem.');
  }finally{
    btn.textContent = originalLabel;
    ev.target.value = '';
  }
});

// A cor escolhida aqui pinta SÓ o círculo central e as duas áreas do gol —
// as linhas de contorno (lateral, área, pênalti) continuam sempre brancas.
document.getElementById('courtColorInput').addEventListener('input', (e)=>{
  if(!three || !three.areaFills) return;
  three.areaFills.forEach(mesh=> mesh.material.color.set(e.target.value));
});

function wireSideToggle(btnId, meshKey){
  const btn = document.getElementById(btnId);
  btn.addEventListener('click', ()=>{
    if(!three || !three.sideExtras) return;
    const mesh = three.sideExtras[meshKey];
    const nowOn = !mesh.visible;
    mesh.visible = nowOn;
    btn.classList.toggle('primary', nowOn);
  });
}
wireSideToggle('toggleStand1','bleachers1');
wireSideToggle('toggleStand2','bleachers2');
wireSideToggle('toggleBench1','bench1');
wireSideToggle('toggleBench2','bench2');

// AMBIENTES SALVOS: fundo, cor das áreas e arquibancada/banco de cada lado,
// tudo junto num preset com nome — pra não ter que remontar toda vez.
// ---------------------------------------------------------------------------
document.getElementById('saveEnvBtn').onclick = ()=>{
  if(!three) return;
  const overlay = openModal(`
    <h3>Salvar ambiente</h3>
    <input type="text" id="envNameInput" placeholder="Nome do ambiente (ex: Ginásio azul)">
    <div id="envSizeWarn" style="font-size:11.5px;color:#e0b84a;margin:-6px 0 8px;"></div>
    <div class="modalBtnRow">
      <button class="secondary" id="envCancelBtn">Cancelar</button>
      <button id="envConfirmBtn">Salvar</button>
    </div>`);
  document.getElementById('envCancelBtn').onclick = ()=> overlay.remove();
  document.getElementById('envNameInput').focus();
  document.getElementById('envConfirmBtn').onclick = async ()=>{
    const nameInput = document.getElementById('envNameInput').value.trim();
    const name = nameInput || `Ambiente ${new Date().toLocaleString('pt-BR')}`;
    const envData = {
      name,
      courtColor: '#'+three.areaFills[0].material.color.getHexString(),
      sides: {
        stand1: three.sideExtras.bleachers1.visible,
        stand2: three.sideExtras.bleachers2.visible,
        bench1: three.sideExtras.bench1.visible,
        bench2: three.sideExtras.bench2.visible
      },
      images: three.envImages,
      savedAt: Date.now()
    };
    const data = JSON.stringify(envData);
    const btn = document.getElementById('envConfirmBtn');
    if(data.length > 4.6*1024*1024){
      document.getElementById('envSizeWarn').textContent = 'As fotos juntas ficaram grandes demais pra salvar. Tenta usar fotos menores/comprimidas.';
      return;
    }
    btn.textContent = 'Salvando...'; btn.disabled = true;
    const key = 'environment_'+Date.now();
    try{
      await storageSet(key, data);
      overlay.remove();
      const status = document.getElementById('status');
      status.textContent = '✓ ambiente salvo';
      setTimeout(()=>status.textContent='', 2000);
    }catch(e){
      console.error(e);
      btn.textContent = 'Erro: ' + (e && e.message ? e.message : 'tentar de novo');
      btn.disabled = false;
    }
  };
};

function applyEnvironment(envData){
  if(!three) return;
  if(envData.courtColor){
    three.areaFills.forEach(mesh=> mesh.material.color.set(envData.courtColor));
    document.getElementById('courtColorInput').value = envData.courtColor;
  }
  if(envData.sides){
    const map = {stand1:'toggleStand1', stand2:'toggleStand2', bench1:'toggleBench1', bench2:'toggleBench2'};
    const meshMap = {stand1:'bleachers1', stand2:'bleachers2', bench1:'bench1', bench2:'bench2'};
    Object.keys(map).forEach(k=>{
      const on = !!envData.sides[k];
      three.sideExtras[meshMap[k]].visible = on;
      document.getElementById(map[k]).classList.toggle('primary', on);
    });
  }
  if(envData.images){
    Object.keys(envData.images).forEach(key=>{
      const dataURL = envData.images[key];
      if(!dataURL) return;
      if(key==='floor') applyFloorPhoto(dataURL);
      else applyBackdropPhoto(key, dataURL);
    });
  }
}

document.getElementById('loadEnvBtn').onclick = async ()=>{
  const overlay = openModal(`<h3>Ambientes salvos</h3><div id="envListArea" style="color:#999;font-size:13px;">Carregando...</div>
    <div class="modalBtnRow"><button class="secondary" id="envListCloseBtn">Fechar</button></div>`);
  document.getElementById('envListCloseBtn').onclick = ()=> overlay.remove();
  const area = document.getElementById('envListArea');
  try{
    const listRes = await storageList('environment_');
    const keys = (listRes && listRes.keys) || [];
    if(keys.length===0){ area.textContent = 'Nenhum ambiente salvo ainda.'; return; }
    const items = [];
    for(const k of keys){
      try{
        const r = await storageGet(k);
        if(r && r.value) items.push({key:k, data: JSON.parse(r.value)});
      }catch(e){}
    }
    items.sort((a,b)=> (b.data.savedAt||0)-(a.data.savedAt||0));
    area.innerHTML = '';
    if(items.length===0){ area.textContent = 'Nenhum ambiente salvo ainda.'; return; }
    items.forEach(item=>{
      const row = document.createElement('div');
      row.className = 'movementItem';
      const dateStr = item.data.savedAt ? new Date(item.data.savedAt).toLocaleDateString('pt-BR') : '';
      row.innerHTML = `<div><span class="mname">${item.data.name || 'Sem nome'}</span><span class="mdate">${dateStr}</span></div>
        <div style="display:flex;gap:6px;">
          <button class="loadBtn">Carregar</button>
          <button class="del">🗑</button>
        </div>`;
      row.querySelector('.loadBtn').onclick = ()=>{
        applyEnvironment(item.data);
        overlay.remove();
      };
      row.querySelector('.del').onclick = async (ev)=>{
        const delBtn = ev.currentTarget;
        if(delBtn.dataset.confirming!=='1'){ delBtn.textContent = 'Confirmar?'; delBtn.dataset.confirming='1'; return; }
        try{ await storageDelete(item.key); row.remove(); }catch(e){ console.error(e); }
      };
      area.appendChild(row);
    });
  }catch(e){
    console.error(e);
    area.textContent = 'Erro ao carregar os ambientes salvos.';
  }
};
